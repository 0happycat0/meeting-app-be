server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: meeting-app-be
  datasource:
    url: ${DB_CONNECTION}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    user:
      name: user
      password: user
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

logging:
  level:
    com.happycat.meetingappbe.service: DEBUG

jwt:
  auth:
    converter:
      resource-id: ${RESOURCE_ID}
      principle-attribute: ${PRINCIPLE_ATTRIBUTE}

keycloak:
  admin:
    server-url: ${KC_SERVER_URL}
    realm: meeting
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}

livekit:
  api-url: ${LIVEKIT_API_URL:http://localhost:7880}
  ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  token-ttl-seconds: ${LIVEKIT_TOKEN_TTL_SECONDS:900}

llm:
  base-url: ${LLM_BASE_URL}
  chat-completions-path: ${LLM_CHAT_COMPLETIONS_PATH}
  model: ${LLM_MODEL}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS}
  proxy:
    enabled: ${LLM_PROXY_ENABLED:false}
    host: ${LLM_PROXY_HOST}
    port: ${LLM_PROXY_PORT}
